spring:
  application:
    name: jobradar-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:55432/jobradar}
    username: ${SPRING_DATASOURCE_USERNAME:jobradar}
    password: ${SPRING_DATASOURCE_PASSWORD:jobradar}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never

app:
  security:
    jwt:
      issuer: ${JWT_ISSUER:jobradar}
      access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:15m}
      refresh-token-ttl: ${JWT_REFRESH_TOKEN_TTL:30d}
      secret: ${JWT_SECRET:change-this-development-secret-change-this-development-secret}
